# @package _global_
task: test

# Test-only options
# (kept here so it only affects runs with task=test)
# PyTorch >=2.6 defaults to weights_only=True which may fail to load Hydra/OmegaConf state.
# Set to false if the checkpoint is trusted (e.g. produced by this repo).
ckpt_weights_only: false
test:
  save_dir: ${paths.output_dir}/test
  pred_threshold: 0.5
  max_samples_per_angle: 10
  save_recon_roi: true
  save_registered_seg: true
  save_proj_comparisons: true

  # Primary segmentation and localization metrics are computed without
  # morphology-altering post-processing. A threshold selected on validation
  # data should be supplied here and then frozen for the test set.
  min_region_size: 1
  voxel_spacing: [0.2, 0.2, 0.2]

  # Connected components / region counting. Do not bridge gaps for the primary
  # comparison; any post-processed sensitivity analysis must be reported apart.
  cc_connectivity: 26
  cc_dilation_iters: 0
