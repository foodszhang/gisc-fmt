name: pah2t_former
output_type: voxel
num_views: 7
in_channels: 1
geometry:
  global_voxel_shape: [190, 200, 104]
benchmark:
  display_name: PAH2T-Former (adapted)
  fidelity: mechanism_preserving_adaptation
  reference_output_shape: [190, 200, 104]
  table_tier: appendix
pah2t_former:
  # The paper uses a projection/depth tensor and paired spatial-channel attention.
  # Here seven views replace the paper-specific input depth, so this remains an
  # adapted, appendix-only implementation rather than an exact reproduction.
  projection_size: [64, 64]
  base_channels: 8
  num_heads: 2
  proj_tokens: 64
  gradient_checkpointing: true
  output_mode: full
  output_shape: [190, 200, 104]
  full_output_shape: [190, 200, 104]
  paste_roi_to_full: false
  loss_type: mse
  dice_weight: 0.5
