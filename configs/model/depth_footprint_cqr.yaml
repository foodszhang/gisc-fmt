name: depth_footprint_cqr
variant: depth_footprint_cqr
num_views: 7
in_channels: 1
feature_dim: 64
pos_enc_dim: 60
geometry:
  camera_distance: 200.0
  detector_size: [256, 256]
  global_voxel_shape: [256, 256, 256]
  use_fmt_simgen_projection: true
gisc_fmt:
  use_adapter: true
  adapter_strategy: bottleneck_decoder
  adapter_mode: per_view
  adapter_cond_dim: 4
  adapter_r_ratio: 8
  norm_type: group
  implicit_field_hidden_dim: 128
  implicit_field_d_x: 60
  implicit_field_d_f: 64
  view_weight_embed_dim: 16
  view_weight_hidden_dim: 32
  multiscale:
    view_embed_dim: 16
    depth_dim: 16
    cross_view_hidden_dim: 64
    scale_hidden_dim: 64
    tau: 1.0
    depth_max: 200.0
  background:
    enable_background: false
    head:
      hidden_dim: 64
      d_x: 60
      d_f: 64
    guidance:
      enable: false
      dim: 16
      mode: film
      hidden_dim: 64
      scale: 1.0
      gate_init_bias: 4.0
ptfa:
  enabled: true
  scales: [s3]
  mode: exit_depth_gaussian
  window: 5
  sigma_px: 1.0
  sigma_min: 0.8
  sigma_max: 2.5
  exit_depth_max_mm: 20.8
  invert_depth: false

