checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${paths.checkpoint_dir}
  filename: "{epoch:02d}-{val_dice:.4f}"
  monitor: val_dice
  mode: max
  save_top_k: 3
  save_last: true
  verbose: true
  every_n_epochs: 1
  save_on_train_epoch_end: false

lr_monitor:
  _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: epoch
  log_momentum: false

progress_bar:
  _target_: pytorch_lightning.callbacks.RichProgressBar

time_estimator:
  _target_: minr_fmt.utils.time_estimator.TrainingTimeEstimator
  log_every_n_steps: 10
  ema_alpha: 0.05

early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: val_dice
  patience: 20
  mode: max
  verbose: true
  check_finite: true
