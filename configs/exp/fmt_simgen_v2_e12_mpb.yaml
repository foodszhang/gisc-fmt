# @package _global_

defaults:
  - fmt_simgen_v2_3k_20k_gisc_e12
  - _self_

name: fmt_simgen_v2_e12_mpb
description: GISC E12 with multi-peak balanced Non-GT sampler on FMT-SimGen v2

data:
  query_sampling:
    type: nongt_mpb
    num_queries: ${data.num_queries}
    trunk_uniform_ratio: 0.30
    meas_proposal_ratio: 0.40
    peak_balanced_ratio: 0.30
    peak_top_m: 5
    peak_min_distance_cells: 3
    peak_blur_sigma: 1.0
    peak_min_value_ratio: 0.1
    use_gt_bbox: false
    use_gt_foreground_oversampling: false
    use_body_mask: false
    use_depth_silhouette_mask: false
