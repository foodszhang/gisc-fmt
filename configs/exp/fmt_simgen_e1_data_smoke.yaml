# @package _global_

name: fmt_simgen_e1_data_smoke
description: FMT-SimGen data adapter smoke run
test_after_training: false
log_config: true
log_git_info: true

data:
  dataset_type: fmt_simgen
  data_dir: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k
  train_dir: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k
  val_dir: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k
  test_dir: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k
  block_dir: null
  sample_num: 16384
  num_queries: 16384
  voxel_size_mm: 0.2
  view_angles: [-90, -60, -30, 0, 30, 60, 90]
  projection_norm: per_view_max
  projection_eps: 1e-8
  use_nongt_sampler: false
  proposal_subdir: proposal
  proposal_filename: meas_backproj_heatmap.npy
  proposal_meta_filename: meas_backproj_meta.json
  trunk_size_mm: [38.0, 40.0, 20.8]
  query_sampling:
    type: nongt_mixed
    num_queries: 16384
    trunk_uniform_ratio: 1.0
    meas_proposal_ratio: 0.0
    use_gt_bbox: false
    use_gt_foreground_oversampling: false
    use_body_mask: false
    use_depth_silhouette_mask: false
  train_max_samples: 16
  val_max_samples: 4
  test_max_samples: 4
  subset_policy: first
  subset_seed: 0
  batch_size: 1
  eval_batch_size: 1
  num_workers: 0
  shuffle: true
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 1

model:
  geometry:
    camera_distance: 200.0
    fov_mm: 80.0
    detector_size: [80.0, 80.0]
    detector_resolution: [256, 256]
    global_voxel_shape: [190, 200, 104]
    volume_center_world: [19.0, 20.0, 10.4]
    use_fmt_simgen_projection: true
    transpose_feature_map_for_sampling: false

trainer:
  accelerator: cpu
  devices: 1
  precision: "32-true"
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  enable_model_summary: false

logger:
  _target_: null
