# @package _global_

defaults:
  - fmt_simgen_e8_ced_s1_ptfa_feature_refine
  - _self_

name: fmt_simgen_e10_tca_ced_s1_ptfa_feature_refine
description: Transport Consensus Adapter on E8-cED s1 PTFA evidence

model:
  residual_scorer:
    enabled: false

  feature_refinement:
    enabled: true
    input_mode: s1_ptfa
    hidden_dim: 128
    geom_dim: 5
    zero_init: true
    ptfa_view_aggregation: transport_consensus_adapter
    transport_consensus_adapter:
      hidden_dim: 128
      epsilon: 0.1
      include_dev_norm: false
      zero_init: true

  ptfa:
    enabled: true
    scales: ["s1"]
    mode: corrected_exit_depth_gaussian
    window: 5
    sigma_min: 0.6
    sigma_max: 1.5
    exit_depth_max_mm: 20.8
    invert_depth: true
