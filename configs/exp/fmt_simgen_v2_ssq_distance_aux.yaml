# @package _global_

defaults:
  - fmt_simgen_v2_ssq_main
  - _self_

name: fmt_simgen_v2_ssq_distance_aux
description: SSQ ablation with distance-to-boundary auxiliary supervision enabled

data:
  center_distance_targets: true
  center_distance_require_precomputed: true
  center_distance_subdir: center_distance

model:
  aux_heads:
    center:
      enabled: false
    distance:
      enabled: true

loss:
  center_weight: 0.0
  distance_weight: 0.1
