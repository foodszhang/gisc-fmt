# @package _global_

defaults:
  - fmt_simgen_v2_e15_center
  - _self_

name: fmt_simgen_v2_e15_center_weak
description: E15 weak center auxiliary head for multi-source separation

loss:
  center_weight: 0.05
  distance_weight: 0.0

trainer:
  max_epochs: 80
  gradient_clip_val: 1.0

optim:
  lr: 0.0005
  scheduler:
    warmup_epochs: 5
    warmup_start_factor: 0.05
