# @package _global_

defaults:
  - fmt_simgen_v2_3k_20k_common
  - override /model: ssq_fmt
  - _self_

name: fmt_simgen_v2_view_complementary
description: From-scratch independent-view complementary source-hypothesis path
seed: 42

data:
  sample_num: 8192
  num_queries: 8192
  eval_sample_num: 8192
  query_sampling:
    num_queries: ${data.num_queries}
  train_max_samples: 100
  val_max_samples: 100
  subset_policy: first
  subset_seed: ${seed}
  batch_size: 1
  eval_batch_size: 1
  component_supervision:
    enabled: true
    max_components: 5

model:
  ssq_fmt:
    density_output_mode: view_complementary
    composition:
      mode: view_complementary
    query_density_backbone:
      enabled: false
    view_complementary:
      training_phase: phase_a
      ablation: full  # a0/shared_only, shared_capacity, a2, a3, full
      separability_mode: geometry_measurement  # none, geometry_only, geometry_measurement
      topk_per_view: 8
      mmax: 5
      delta_max_mm: 3.0
      nms_radius_mm: 3.0
      sigma_nms_mm: 4.0
      sigma_assoc_mm: 5.0
      sigma_min_mm: 1.0
      sigma_max_mm: 8.0
      score_threshold: 0.05
      candidate_conf_threshold: 0.4
      delta_s: 0.25
      epsilon_s: 0.1
      evidence_eta0: 0.25
      context_warmup_steps: 50
      lambda_separability_measurement: 0.0
      lambda_center: 1.0
      lambda_cov: 0.1
      lambda_exist: 0.5
      lambda_cover: 0.5
      lambda_dup: 0.1
      lr:
        encoder: 0.000005
        constructor: 0.00001
        candidate_encoder: 0.00003
        candidate_context: 0.00003
        decoder: 0.00002
        separability: 0.0
        shared: 0.0
    memory:
      checkpoint_encoder: true
      checkpoint_decoder: true

loss:
  light_weight: 1.0
  pos_weight: 50.0
  sparse_weight: 0.1
  dice_weight: 0.5
  lambda_shared: 0.0

optim:
  lr: 0.0001
  weight_decay: 0.0001

trainer:
  max_epochs: 6
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 1
