# @package _global_

defaults:
  - fmt_simgen_e1b_nongt_mixed
  - _self_

name: fmt_simgen_e8_s1_ptfa_feature_refine
description: High-resolution s1 fixed-PTFA feature refinement without residual scorer

model:
  ptfa:
    enabled: true
    scales: ["s1"]
    mode: fixed_gaussian
    window: 5
    sigma_px: 1.0

  residual_scorer:
    enabled: false

  feature_refinement:
    enabled: true
    hidden_dim: 128
    geom_dim: 5
    zero_init: true
