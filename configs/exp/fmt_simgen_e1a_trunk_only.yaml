# @package _global_

defaults:
  - fmt_simgen_e1_data_smoke
  - _self_

name: fmt_simgen_e1a_trunk_only
description: FMT-SimGen trunk-uniform Non-GT sampler baseline

data:
  use_nongt_sampler: true
  query_sampling:
    type: nongt_mixed
    num_queries: ${data.num_queries}
    trunk_uniform_ratio: 1.0
    meas_proposal_ratio: 0.0
    use_gt_bbox: false
    use_gt_foreground_oversampling: false
    use_body_mask: false
    use_depth_silhouette_mask: false
