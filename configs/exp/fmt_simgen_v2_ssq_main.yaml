# @package _global_

defaults:
  - fmt_simgen_v2_e15_center_distance
  - _self_

name: fmt_simgen_v2_ssq_main
description: Multi-source GISC-FMT mainline with measurement-derived all-candidate conditioning and canonical reliability

data:
  center_distance_targets: false
  center_distance_require_precomputed: false

  source_hypothesis:
    enabled: true
    # Over-complete candidate budget. This is not the predicted source count.
    top_m: 5
    blur_sigma: 1.0
    min_distance_cells: 3
    min_value_ratio: 0.1

model:
  ptfa:
    enabled: true

  feature_refinement:
    enabled: true
    ptfa_view_aggregation: canonical_reliability

  source_instance_cue:
    enabled: true
    dim: 10
    tau_s_mm: 5.0
    aggregation: all_candidates_null
    null_logit: 0.0
    score_weight: 2.0
    min_scale_mm: 1.0
    max_scale_mm: 20.0

  source_instance_decoder:
    enabled: false

  aux_heads:
    hidden_dim: 64
    center:
      enabled: false
    distance:
      enabled: false

loss:
  center_weight: 0.0
  distance_weight: 0.0
