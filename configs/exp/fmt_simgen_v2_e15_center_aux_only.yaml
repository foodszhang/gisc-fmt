# @package _global_

defaults:
  - fmt_simgen_v2_e15_center
  - _self_

name: fmt_simgen_v2_e15_center_aux_only
description: E15 center auxiliary only, no center residual, weak focal center loss

data:
  dataset_type: fmt_simgen
  center_distance_targets: true
  center_distance_require_precomputed: true
  center_distance_subdir: center_distance

model:
  aux_heads:
    hidden_dim: 64
    center:
      enabled: true
      logit_residual: 0.0
      residual_warmup_epochs: 0
    distance:
      enabled: false

loss:
  center_weight: 0.02
  distance_weight: 0.0
  center_sigma_mm: 0.5

optim:
  lr: 0.0005
  scheduler:
    warmup_epochs: 5
    warmup_start_factor: 0.05

trainer:
  max_epochs: 40
  gradient_clip_val: 1.0
