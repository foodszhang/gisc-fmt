# @package _global_

defaults:
  - fmt_simgen_v2_ssq_gate_independent_compensation
  - _self_

name: fmt_simgen_v2_ssq_gate_refined_joint_scratch
description: From-scratch joint Full SSQ-FMT with refined measurement candidates

model:
  ssq_fmt:
    candidate_context:
      enabled: true
      hidden_dim: 64
      field_hidden_dim: 64

loss:
  candidate_assignment_weight: 0.0
  candidate_branch_density_weight: 0.0
  candidate_branch_dice_weight: 0.0

optim:
  lr: 0.0005
  weight_decay: 0.0001
  scheduler:
    warmup_epochs: 5
    warmup_start_factor: 0.2

trainer:
  max_epochs: 20
  check_val_every_n_epoch: 1
