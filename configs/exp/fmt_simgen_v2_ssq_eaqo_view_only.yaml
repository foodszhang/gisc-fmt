defaults:
  - fmt_simgen_v2_ssq_final
  - _self_

model:
  ssq_fmt:
    eaqo:
      enabled: true
      mode: loss_weight
      alpha_pred: 0.0
      beta_view: 1.0
      gamma_geo: 0.0
      delta_comp: 0.0
      weight_clip_min: 1.0
      weight_clip_max: 3.0
      detach_score: true
      normalize_score: batch_minmax
      eps: 1.0e-6
