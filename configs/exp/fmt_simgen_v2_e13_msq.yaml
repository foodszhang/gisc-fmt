# @package _global_

defaults:
  - fmt_simgen_v2_e12_mpb_auxnorm
  - _self_

name: fmt_simgen_v2_e13_msq
description: E13 Multi-Source Quotient Representation on FMT-SimGen v2

data:
  source_hypothesis:
    enabled: true
    top_m: 5
    blur_sigma: 1.0
    min_distance_cells: 3
    min_value_ratio: 0.1

model:
  source_instance_cue:
    enabled: true
    dim: 10
    tau_s_mm: 5.0

  feature_refinement:
    geom_dim: 15

loss:
  use_tversky: false

optim:
  lr: 0.0001
  scheduler:
    warmup_epochs: 1
    warmup_start_factor: 0.2
