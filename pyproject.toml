[project]
name = "minr_fmt"
version = "0.1.0"
description = "Research project: gisc-fmt"
authors = [
    {name = "foodszhang", email = "author@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.0",
    "pytorch-lightning>=2.1.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.15.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "scipy>=1.12.0",
    "scikit-image>=0.22.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "timm>=1.0.0",
    "tensorboard>=2.16.0",
    "torchvision>=0.20.0",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.setuptools]
packages = ["minr_fmt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
